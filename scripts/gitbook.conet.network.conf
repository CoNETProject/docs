# __DOMAIN__ — CoNET self-hosted GitBook (HonKit static)
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root __REMOTE_WWW__;
    index index.html;

    # Product pages moved under Applications/
    location = /l0/silentpass-vpn.html {
        return 301 /applications/silentpass-vpn.html;
    }
    location = /l0/silentpass-vpn {
        return 301 /applications/silentpass-vpn.html;
    }
    location = /l0/silentpass-vpn.md {
        return 301 /applications/silentpass-vpn.html;
    }
    location = /applications.html {
        return 301 /applications/;
    }

    location ^~ /l1/network/ {
        types {
            application/json json;
            text/yaml yml yaml;
            application/octet-stream ssz;
        }
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }
}
